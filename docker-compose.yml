services:
  postgres:
    image: postgres:17
    container_name: riskora-db
    environment:
      POSTGRES_DB: riskora
      POSTGRES_USER: riskora
      POSTGRES_PASSWORD: riskora_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskora -d riskora"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
